name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  clj:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ['8', '11', '17', '21']
        clojure: ['clojure-1-10', 'clojure-1-11', 'clojure-1-12']
    name: clj (JDK ${{ matrix.jdk }}, ${{ matrix.clojure }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          lein: 2.12.0
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ matrix.jdk }}-${{ matrix.clojure }}-${{ hashFiles('project.clj') }}
          restore-keys: m2-${{ matrix.jdk }}-${{ matrix.clojure }}-
      - run: lein with-profile +${{ matrix.clojure }} test

  cljs:
    runs-on: ubuntu-latest
    name: cljs (Node)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.6.1673
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-cljs-${{ hashFiles('deps.edn') }}
          restore-keys: m2-cljs-
      - run: clojure -M:test-cljs

  lint:
    runs-on: ubuntu-latest
    name: lint (clj-kondo)
    steps:
      - uses: actions/checkout@v7
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          clj-kondo: 2026.08.04
      - run: clj-kondo --lint src test test-cljs --fail-level warning

  format:
    runs-on: ubuntu-latest
    name: format (cljfmt)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.6.1673
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-cljfmt-${{ hashFiles('deps.edn') }}
          restore-keys: m2-cljfmt-
      - run: clojure -M:cljfmt check src test test-cljs
